apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.skstudio.BabyWAstickersApp"  // Add this to define the namespace
     compileSdkVersion 36

    defaultConfig {
        applicationId "com.skstudio.BabyWAstickersApp"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 2
        versionName "2.1.7"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Define ContentProvider authority
        def contentProviderAuthority = applicationId + ".stickercontentprovider"
        manifestPlaceholders = [contentProviderAuthority: contentProviderAuthority]
        buildConfigField("String", "CONTENT_PROVIDER_AUTHORITY", "\"${contentProviderAuthority}\"")
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    aaptOptions {
        noCompress "webp" // Preserve .webp files without compression
    }

    buildFeatures {
        buildConfig true // Enable BuildConfig generation
    }

    packaging {
        resources {
            excludes += 'lib/*/libnative-imagetranscoder.so'
            excludes += 'lib/*/libnative-filters.so'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    implementation 'com.google.ads.mediation:unity:4.9.2.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Fresco dependencies for image handling
    def fresco_version = '3.6.0' // Latest version for 16KB support
    implementation "com.facebook.fresco:fresco:$fresco_version"
    implementation "com.facebook.fresco:webpsupport:$fresco_version"
    implementation "com.facebook.fresco:animated-webp:$fresco_version"
    implementation "com.facebook.fresco:animated-base:$fresco_version"
    implementation "com.facebook.fresco:imagepipeline-okhttp3:$fresco_version"

    // Explicitly add SoLoader to avoid versioning issues
    implementation 'com.facebook.soloader:soloader:0.12.1'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)  // Ensure you need Java 17; otherwise, default to Java 8
    }
}
